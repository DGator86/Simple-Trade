[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-trade"
version = "0.1.0"
description = "Simple trading research: data ingestion and backtesting"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pyarrow>=14", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
simple-trade-data = "simple_trade.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "RUF"]
